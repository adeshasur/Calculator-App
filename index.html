<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Calc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-grid"></div>
    <div class="calculator">
        <div class="display">
            <div class="display-expression" id="expression"></div>
            <div class="display-result" id="result">0</div>
        </div>
        
        <div class="keyboard">
            <button class="btn btn-function" data-action="clear">AC</button>
            <button class="btn btn-function" data-action="toggle-sign">±</button>
            <button class="btn btn-function" data-action="percent">%</button>
            <button class="btn btn-operator" data-action="operator">÷</button>
            
            <button class="btn btn-number">7</button>
            <button class="btn btn-number">8</button>
            <button class="btn btn-number">9</button>
            <button class="btn btn-operator" data-action="operator">×</button>
            
            <button class="btn btn-number">4</button>
            <button class="btn btn-number">5</button>
            <button class="btn btn-number">6</button>
            <button class="btn btn-operator" data-action="operator">−</button>
            
            <button class="btn btn-number">1</button>
            <button class="btn btn-number">2</button>
            <button class="btn btn-number">3</button>
            <button class="btn btn-operator" data-action="operator">+</button>
            
            <button class="btn btn-number btn-double" data-action="zero">0</button>
            <button class="btn btn-number" data-action="decimal">.</button>
            <button class="btn btn-operator" data-action="equals">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
